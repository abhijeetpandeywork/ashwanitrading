name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and Deploy
        env:
          SSH_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass rsync
          sshpass -p "$SSH_PASSWORD" rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='gh_cli' \
            --exclude='gh.zip' \
            --exclude='curl_output.html' \
            --exclude='pipeline.txt' \
            --exclude='live_site_screenshot.png' \
            -e "ssh -o StrictHostKeyChecking=no -p 65002" \
            ./ \
            u406313474@ashwanitrading.digitalrubix.site:domains/ashwanitrading.digitalrubix.site/public_html/
